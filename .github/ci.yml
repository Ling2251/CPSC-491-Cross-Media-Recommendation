name: Project CI

on:
  push:
    branches: [ main, AI-Recommendation, feature/* ]

  pull_request:
    branches: [ main, AI-Recommendation ]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-backend/requirements.txt

      - name: Run backend tests
        run: |
          pytest ai-backend/tests -v --tb=short

      - name: Backend test summary
        if: always()
        run: |
          echo "Backend test suite completed"

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Show build version
        run: |
          echo "Build Number: ${{ github.run_number }}"
          echo "Commit SHA: ${{ github.sha }}"

      - name: Build frontend
        run: npm run build