name: SOC2 CC9.2 inventory checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate CC9.2 inventory
        run: python3 security/check_third_party_inventory.py
      - name: Run CC9.2 inventory unit tests
        run: python3 -m unittest discover -s security/tests -v
      - name: Install AI collector test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/ai-backend/requirements.txt
      - name: Run external API resilience tests (TVMaze and Open Library)
        run: python3 -m pytest backend/ai-backend/tests/test_public_data.py backend/ai-backend/tests/test_cc92_external_api_security.py -q
      - name: Set up Node.js for TMDB checks
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run external API resilience tests (TMDB)
        run: node security/tests/test_tmdb_cc92.js
