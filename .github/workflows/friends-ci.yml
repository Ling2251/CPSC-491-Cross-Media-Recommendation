name: FriendsRecommendation CI/CD

# =========================================================
# WORKFLOW TRIGGERS
# =========================================================
on:
  # Run when code is pushed to the Friend Recommendation
  # integration branch or merged into main.
  push:
    branches:
      - merge-FriendsRecommendation
      - main

  # Run CI before pull requests are merged.
  pull_request:
    branches:
      - merge-FriendsRecommendation
      - main

  # Allow manual execution from GitHub -> Actions.
  workflow_dispatch:


# Read-only repository access is enough for this CI workflow.
permissions:
  contents: read


# Prevent multiple outdated runs on the same branch from
# continuing unnecessarily.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  # =========================================================
  # 1. GENERATE UNIQUE BUILD VERSION
  # =========================================================
  version:
    name: Generate Build Version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      build_version: ${{ steps.version.outputs.build_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate unique build version
        id: version
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_VERSION="build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"

          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "CPSC 491 Build Version"
          echo "${BUILD_VERSION}"
          echo "======================================"


  # =========================================================
  # 2. FRONTEND BUILD AND VALIDATION
  # =========================================================
  frontend:
    name: Frontend Build and Validation
    runs-on: ubuntu-latest
    needs: version
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # Set up Node.js
      # -----------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      # -----------------------------------------------------
      # Install exact dependencies from package-lock.json
      # -----------------------------------------------------
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci


      # -----------------------------------------------------
      # Run ESLint
      # -----------------------------------------------------
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint


      # -----------------------------------------------------
      # Build React/Vite production application
      # -----------------------------------------------------
      - name: Build React frontend
        working-directory: frontend
        run: npm run build


      # -----------------------------------------------------
      # Run frontend tests if a test script exists
      # -----------------------------------------------------
      - name: Run frontend tests
        working-directory: frontend
        run: npm test --if-present


      # -----------------------------------------------------
      # Save the production build as a GitHub artifact
      # -----------------------------------------------------
      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ needs.version.outputs.build_version }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 14


      # -----------------------------------------------------
      # Frontend summary
      # -----------------------------------------------------
      - name: Frontend build summary
        if: always()
        run: |
          echo "======================================"
          echo "Frontend validation completed"
          echo "Build: ${{ needs.version.outputs.build_version }}"
          echo "======================================"


  # =========================================================
  # 3. PYTHON BACKEND TESTS
  # =========================================================
  backend-python:
    name: Python Backend Tests
    runs-on: ubuntu-latest
    needs: version
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # Set up Python
      # -----------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt


      # -----------------------------------------------------
      # Install backend dependencies
      # -----------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest


      # -----------------------------------------------------
      # Run Python backend tests
      # -----------------------------------------------------
      - name: Run backend Python tests
        run: |
          python -m pytest backend/tests -v --tb=short


      # -----------------------------------------------------
      # Backend test summary
      # -----------------------------------------------------
      - name: Python test summary
        if: always()
        run: |
          echo "======================================"
          echo "Python backend tests completed"
          echo "Build: ${{ needs.version.outputs.build_version }}"
          echo "======================================"


  # =========================================================
  # 4. JAVASCRIPT BACKEND VALIDATION
  # =========================================================
  backend-javascript:
    name: JavaScript Backend Validation
    runs-on: ubuntu-latest
    needs: version
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # Set up Node.js
      # -----------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # -----------------------------------------------------
      # Validate server.js syntax
      # -----------------------------------------------------
      - name: Check server.js syntax
        shell: bash
        run: |
          if [ -f "backend/server.js" ]; then
            node --check backend/server.js
          else
            echo "backend/server.js not found - skipping."
          fi


      # -----------------------------------------------------
      # Validate db.js syntax
      # -----------------------------------------------------
      - name: Check db.js syntax
        shell: bash
        run: |
          if [ -f "backend/db.js" ]; then
            node --check backend/db.js
          else
            echo "backend/db.js not found - skipping."
          fi


      # -----------------------------------------------------
      # JavaScript validation summary
      # -----------------------------------------------------
      - name: JavaScript backend summary
        if: always()
        run: |
          echo "======================================"
          echo "JavaScript backend validation completed"
          echo "Build: ${{ needs.version.outputs.build_version }}"
          echo "======================================"


  # =========================================================
  # 5. FINAL CI STATUS
  # =========================================================
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest

    needs:
      - version
      - frontend
      - backend-python
      - backend-javascript

    timeout-minutes: 5

    steps:
      - name: Display successful CI result
        run: |
          echo "======================================"
          echo "CPSC 491 CI/CD PASSED"
          echo ""
          echo "Build Version:"
          echo "${{ needs.version.outputs.build_version }}"
          echo ""
          echo "Frontend: PASSED"
          echo "Python Backend: PASSED"
          echo "JavaScript Backend: PASSED"
          echo "======================================"