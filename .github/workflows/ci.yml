name: Backend CI Tests

on:
  push:
    branches: [ main, AI-Recommendation, feature/* ]
    paths:
      - 'ai-backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, AI-Recommendation ]
    paths:
      - 'ai-backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r ai-backend/requirements.txt

    - name: Run backend tests
      run: |
        pytest ai-backend/tests -v --tb=short

    - name: Test results summary
      if: always()
      run: |
        echo "Backend test suite completed"
