name: CPSC 491 CI

on:
  # Run automatically whenever code is pushed or merged into main
  push:
    branches:
      - main

  # Also run before a pull request is merged into main
  pull_request:
    branches:
      - main

  # Allows manual execution from the GitHub Actions page
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------
      # 1. CHECK OUT REPOSITORY
      # ------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------
      # 2. GENERATE UNIQUE BUILD VERSION
      # ------------------------------------------------
      - name: Generate build version
        id: version
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_VERSION="build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"

          echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          echo "version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "Build Version: ${BUILD_VERSION}"
          echo "======================================"


      # ------------------------------------------------
      # 3. SET UP NODE.JS
      # ------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      # ------------------------------------------------
      # 4. CHECK BACKEND JAVASCRIPT SYNTAX
      # ------------------------------------------------
      - name: Check backend JavaScript syntax
        run: |
          node --check backend/server.js
          node --check backend/db.js


      # ------------------------------------------------
      # 5. INSTALL FRONTEND DEPENDENCIES
      # ------------------------------------------------
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci


      # ------------------------------------------------
      # 6. LINT FRONTEND
      # ------------------------------------------------
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint --if-present


      # ------------------------------------------------
      # 7. BUILD REACT/VITE FRONTEND
      # ------------------------------------------------
      - name: Build React frontend
        working-directory: frontend
        run: npm run build


      # ------------------------------------------------
      # 8. SET UP PYTHON
      # ------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt


      # ------------------------------------------------
      # 9. INSTALL PYTHON DEPENDENCIES
      # ------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest


      # ------------------------------------------------
      # 10. RUN PYTHON TESTS
      # ------------------------------------------------
      - name: Run backend Python tests
        working-directory: backend
        run: |
          python -m pytest tests -v


      # ------------------------------------------------
      # 11. DISPLAY BUILD INFORMATION
      # ------------------------------------------------
      - name: Display successful build
        run: |
          echo "======================================"
          echo "CI completed successfully"
          echo "Build Version: $BUILD_VERSION"
          echo "======================================"


      # ------------------------------------------------
      # 12. SAVE FRONTEND PRODUCTION BUILD
      # ------------------------------------------------
      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ steps.version.outputs.version }}
          path: frontend/dist/
          if-no-files-found: error