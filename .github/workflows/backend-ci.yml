
name: Backend CI Tests

on:
  push:
    branches: [ main, AI-Recommendation, feature/* ]
    paths:
      - 'backend/ai-backend/**'
      - 'database/**'
      - '.github/workflows/ci.yml'

  pull_request:
    branches: [ main, AI-Recommendation ]
    paths:
      - 'backend/ai-backend/**'
      - 'database/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/ai-backend/requirements.txt

      - name: Run backend tests
        run: |
          if [ -d "backend/ai-backend/tests" ]; then
            pytest backend/ai-backend/tests -v --tb=short
          else
            echo "No tests found in backend/ai-backend/tests"
          fi

      - name: Test results summary
        if: always()
        run: |
          echo "Backend test suite completed"
